name: Lab CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ЛР5: модульні та інтеграційні тести (Jest)
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # ЛР6: e2e тести (Playwright, Chromium)
  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test tests/e2e --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: lab6/playwright-report/
          retention-days: 7
